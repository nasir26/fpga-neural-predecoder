# Single source of truth for default parameters. Every bench/ script reads
# this file and accepts CLI overrides on top of it; nothing here is
# duplicated as a hardcoded default elsewhere.

seed: 0

code:
  distance: 5
  rounds: 5
  basis: z  # "x" or "z"

noise:
  kind: uniform_depolarizing
  p: 0.003
  # kind: full25 is defined in src/qec/circuits.py's NoiseModel but not
  # implemented yet; see docs/LIMITATIONS.md.

sampling:
  shots: 100000

baseline:
  timing_shots: 1000  # single-shot decode.() calls timed individually, batch_size=1

metrics:
  confidence: 0.95

model:
  R: 5           # receptive field; depth = (R-1)/2
  width: 64       # channels in each hidden Conv3d layer
  channels: [64, 64, 64]  # informational; actual widths are uniform=width for now

training:
  shots_per_epoch: 2000000
  epochs: 20
  batch_size: 256
  lr: 0.001
  basis: z
  noise_upscaling:
    enabled: true
    target_p: 0.006   # train at this p; deliberately higher than eval p (see docs/DECISIONS.md)
  eval_p: 0.003         # evaluate the trained model at this p (matches Phase 1 baseline)
  # Deliberate deviation from the reference recipe (67M shots/epoch, 100
  # epochs, 8 GPUs): CPU-only training budget. See docs/LIMITATIONS.md.
