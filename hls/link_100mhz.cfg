#
# v++ link-stage config: pins predecoder_kernel's clock to 100 MHz (10 ns
# period), matching Phase 4's original vitis_hls project-flow target
# (hls/run_hls.tcl: create_clock -period 10). Without this, `v++ -l -t hw`
# uses its own default (observed: ~300 MHz / 3.33 ns, taken from the .xo's
# csynth target), which left timing unclosed on the first hw build attempt
# (WNS -0.609 ns, 8418/701750 endpoints failing; see docs/DECISIONS.md,
# 2026-08-19). -0.609 ns against a 3.33 ns period is a large fraction of
# the period, so the ~3x larger slack budget at 10 ns is expected to close
# it, at the cost of proportionally worse absolute per-shot latency (cycle
# counts are unchanged; only ns-per-cycle changes).
#
# Kernel instance name (predecoder_kernel_1) confirmed from
# build_hw/predecoder_kernel.xclbin.info's IP_LAYOUT section on the first
# hw build, not guessed.
#
# Usage (link step only; the .xo from `v++ -c -t hw` does not need to be
# regenerated -- HLS cycle counts do not depend on link-time clock
# assignment):
#   v++ -l -t hw --platform <xpfm> --config link_100mhz.cfg \
#       -o build_hw/predecoder_kernel.xclbin build_hw/predecoder_kernel.xo

[clock]
freqHz=100000000:predecoder_kernel_1
